name: APK Android

# Compila la APK en cada cambio de la app, la deja como artefacto y, en main,
# la publica en la release «latest» de GitHub; la página de descarga (site/)
# apunta a ese archivo.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'cloudflare/**', 'docs/**', '**/*.md', 'wrangler.jsonc']
  pull_request:
    paths-ignore: ['site/**', 'docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas, tipos y lint
        run: |
          npm test -- --ci
          npm run typecheck
          npx expo lint

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generar proyecto nativo de Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Preparar archivos
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/oieg-quest.apk
          VERSION=$(node -p "require('./app.json').expo.version")
          printf '{"version":"%s","commit":"%s"}\n' "$VERSION" "${GITHUB_SHA::7}" > dist/apk-info.json
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: oieg-quest-apk
          path: dist/
          retention-days: 30

      - name: Publicar en la release latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "OIEG Quest (última versión)" --notes "APK más reciente de la rama main."
          gh release upload latest dist/oieg-quest.apk --clobber
