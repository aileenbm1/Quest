name: APK Android

# Compila la APK en cada cambio de la app y la publica en Cloudflare R2,
# desde donde el Worker la entrega en <tu-dominio>/descargar.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'cloudflare/**', 'docs/**', '**/*.md', 'wrangler.jsonc']
  pull_request:
    paths-ignore: ['site/**', 'docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas, tipos y lint
        run: |
          npm test -- --ci
          npm run typecheck
          npx expo lint

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generar proyecto nativo de Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Preparar archivos
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/oieg-quest.apk
          VERSION=$(node -p "require('./app.json').expo.version")
          printf '{"version":"%s","commit":"%s"}\n' "$VERSION" "${GITHUB_SHA::7}" > dist/apk-info.json
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: oieg-quest-apk
          path: dist/
          retention-days: 30

      - name: Publicar en Cloudflare R2
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler r2 object put oieg-quest-apk/oieg-quest.apk --file dist/oieg-quest.apk \
            --content-type application/vnd.android.package-archive --remote
          npx wrangler r2 object put oieg-quest-apk/apk-info.json --file dist/apk-info.json \
            --content-type application/json --remote

      - name: Aviso si faltan los secretos de Cloudflare
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID; la APK quedó solo como artefacto de esta ejecución."
